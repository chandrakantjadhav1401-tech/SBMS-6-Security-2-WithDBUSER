<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>403 Forbidden</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        text-align: center;
        background: rgba(0, 0, 0, 0.4);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
        font-size: 80px;
        margin: 0;
        color: #ff4b5c;
    }

    h2 {
        margin: 10px 0;
        font-size: 28px;
    }

    p {
        font-size: 16px;
        margin: 15px 0;
        color: #ddd;
    }

    a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 25px;
        background: #ff4b5c;
        color: white;
        text-decoration: none;
        border-radius: 25px;
        transition: 0.3s;
    }

    a:hover {
        background: #ff1e38;
    }
</style>

</head>

<body>

<div class="container">
    <h1>403</h1>
    <h2>Access Forbidden</h2>
    <p>You don’t have permission to access this page.</p>
    <p>Please check your credentials or go back to the homepage.</p>
    <a href="#">Go Back</a>
</div>

</body>
</html>
